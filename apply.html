<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | Legends Are Made</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER AND NAVIGATION -->
    <header>
        <nav>
            <a href="home.html" class="logo">LEGENDS<span>///</span></a>

            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="competitions.html">Competitions</a>
                <a href="apply.html">Apply</a>
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>

        <!-- PAGE INTRODUCTION -->
        <section class="page-header">
            <h1>APPLY</h1>

            <p>
                Complete the application form to apply for a
                Legends Are Made competition.
            </p>
        </section>

        <!-- APPLICATION FORM -->
        <section class="form-section">

            <div class="form-container">

                <h2>Competition Application</h2>

                <form>

                    <div class="form-group">
                        <label for="competitor-name">
                            Competitor Name
                        </label>

                        <input type="text"
                               id="competitor-name"
                               name="competitor-name"
                               placeholder="Enter your name"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Enter your email address"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="contact-number">
                            Contact Number
                        </label>

                        <input type="tel"
                               id="contact-number"
                               name="contact-number"
                               placeholder="Enter your contact number"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="dance-studio">
                            Dance Studio
                        </label>

                        <input type="text"
                               id="dance-studio"
                               name="dance-studio"
                               placeholder="Enter dance studio name">
                    </div>

                    <div class="form-group">
                        <label for="category">
                            Competition Category
                        </label>

                        <select id="category"
                                name="category"
                                required>

                            <option value="">
                                Select a category
                            </option>

                            <option value="latin">
                                Latin
                            </option>

                            <option value="ballroom">
                                Ballroom
                            </option>

                            <option value="freestyle">
                                Freestyle
                            </option>

                            <option value="vocals">
                                Singing / Vocals
                            </option>

                            <option value="cheer">
                                Performing Cheer
                            </option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="age-group">
                            Age Group
                        </label>

                        <select id="age-group"
                                name="age-group"
                                required>

                            <option value="">
                                Select age group
                            </option>

                            <option value="junior">
                                Junior
                            </option>

                            <option value="adult">
                                Adult
                            </option>

                            <option value="senior">
                                Senior
                            </option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">
                            Message
                        </label>

                        <textarea id="message"
                                  name="message"
                                  rows="6"
                                  placeholder="Enter any additional information"></textarea>
                    </div>

                    <button type="submit">
                        SUBMIT APPLICATION
                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>

        <div class="footer-content">

            <div>
                <div class="footer-logo">
                    LEGENDS<span>///</span>
                </div>

                <p>
                    Legends Are Made Dance Series
                </p>
            </div>

            <div class="footer-links">
                <a href="home.html">Home</a>
                <a href="competitions.html">Competitions</a>
                <a href="apply.html">Apply</a>
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
            </div>

        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 Legends Are Made Dance Series</p>
        </div>

    </footer>

</body>
</html>
