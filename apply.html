<main>

<!--------------------PAGE INTRODUCTION------------------>
<section class="page-header">

<h1>APPLY</h1>

<p>
Complete the application form to apply for a
Legends Are Made competition.
</p>

</section>

<!---------------------APPLICATION FORM---------------------->
<section class="form-section">

<div class="form-container">

<h2>
COMPETITION APPLICATION
</h2>

<form>

<!--Competitor name-->
<div class="form-group">

<label for="competitor-name">
Competitor Name
</label>

<input
type="text"
id="competitor-name"
name="competitor-name"
placeholder="Enter your name"
required>

</div>

<!--Email-->
<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
name="email"
placeholder="Enter your email address"
required>

</div>

<!--Contact number-->
<div class="form-group">

<label for="contact-number">
Contact Number
</label>

<input
type="tel"
id="contact-number"
name="contact-number"
placeholder="Enter your contact number"
required>

</div>

<!--Dance studio-->
<div class="form-group">

<label for="dance-studio">
Dance Studio
</label>

<input
type="text"
id="dance-studio"
name="dance-studio"
placeholder="Enter dance studio name">

</div>

<!--Competition category-->
<div class="form-group">

<label for="category">
Competition Category
</label>

<select
id="category"
name="category"
required>

<option value="">
Select a category
</option>

<option value="latin">
Latin
</option>

<option value="ballroom">
Ballroom
</option>

<option value="freestyle">
Freestyle
</option>

<option value="vocals">
Singing / Vocals
</option>

<option value="cheer">
Performing Cheer
</option>

</select>

</div>

<!--Age group-->
<div class="form-group">

<label for="age-group">
Age Group
</label>

<select
id="age-group"
name="age-group"
required>

<option value="">
Select age group
</option>

<option value="junior">
Junior
</option>

<option value="adult">
Adult
</option>

<option value="senior">
Senior
</option>

</select>

</div>

<!--Additional message-->
<div class="form-group">

<label for="message">
Message
</label>

<textarea
id="message"
name="message"
rows="6"
placeholder="Enter any additional information"></textarea>

</div>

<!--Submit button-->
<button type="submit">
SUBMIT APPLICATION
</button>

</form>

</div>
</section>
