<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Legends Are Made</title>
</head>

<body>

    <!--Website Header-->
    <header>

        <!--Navigation Menu-->
        <nav>
            <a href="home.html">Home</a>
            <a href="competitions.html">Competitions</a>
            <a href="apply.html">Apply</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main>

        <!--Contact Information-->
        <section>

            <h1>Contact Us</h1>

            <h2>Contact Details</h2>

            <p>
                Get in touch with Legends Are Made Dance Series
                for enquiries about competitions and events.
            </p>

        </section>


        <!--Email-->
        <section>
            <h2>Email</h2>

            <p>
                <a href="mailto:legendsaremadecomp@gmail.com">
                    legendsaremadecomp@gmail.com
                </a>
            </p>
        </section>


        <!--Social Media-->
        <section>

            <h2>Social Media</h2>

            <p>
                <a href="https://www.facebook.com/share/18AZhLgrUn/?mibextid=wwXIfr">Facebook</a>
            </p>

            <p>
                <a href="https://www.instagram.com/legendsaremadedanceseries">Instagram</a>
            </p>

        </section>


        <!--Enquiry Form-->
        <section>

            <h2>Enquiry Form</h2>

            <form>

                <label for="contact-name">Name:</label>
                <input type="text"
                       id="contact-name"
                       name="contact-name"
                       required>


                <label for="contact-email">Email:</label>
                <input type="email"
                       id="contact-email"
                       name="contact-email"
                       required>


                <label for="enquiry">Enquiry:</label>

                <textarea id="enquiry"
                          name="enquiry"
                          rows="5"
                          required>
                </textarea>


                <button type="submit">
                    Send Enquiry
                </button>

            </form>

        </section>

    </main>


    <!--Footer-->
    <footer>
        <p>&copy; 2026 Legends Are Made Dance Series</p>
    </footer>

</body>
</html>
